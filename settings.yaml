apiVersion: v1alpha1
kind: Setting
metadata:
  name: warm-island-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: owner_name
          label: 站点名称
        - $formkit: textarea
          name: site_description
          label: 站点描述
        - $formkit: attachment
          name: logo
          label: 自定义 Logo
        - $formkit: attachment
          name: favicon
          label: 自定义 Favicon
        - $formkit: text
          name: label_search
          label: 搜索按钮标签
        - $formkit: text
          name: label_theme_switch
          label: 主题切换标签
        - $formkit: text
          name: label_archives_title
          label: 归档页标题
    - group: welcome_popup
      label: 欢迎弹窗
      formSchema:
        - $formkit: switch
          name: welcome_popup_enabled
          id: welcome_popup_enabled
          label: 启用欢迎弹窗
          value: false
          help: 首页显示"欢迎来自 XX·XX·XX 的朋友"的浮动提示弹窗，基于访客 IP 地理定位
        - $formkit: select
          name: welcome_popup_position
          id: welcome_popup_position
          label: 弹窗位置
          options:
            - label: 顶端漂窗（顶部居中）
              value: top-center
            - label: 右上
              value: top-right
            - label: 左上
              value: top-left
            - label: 右下
              value: bottom-right
            - label: 左下
              value: bottom-left
          value: top-center
          if: "$get(welcome_popup_enabled).value === true"
        - $formkit: number
          name: welcome_popup_duration
          id: welcome_popup_duration
          label: 自动消失时间（秒）
          value: 5
          min: 3
          max: 60
          step: 1
          help: 弹窗自动消失的秒数，范围 3-60
          if: "$get(welcome_popup_enabled).value === true"
        - $formkit: url
          name: welcome_popup_api
          id: welcome_popup_api
          label: IP 定位主 API
          value: "https://myip.ipip.net/json"
          help: 返回 JSON 的 IP 定位主接口，默认 IPIP；留空使用默认值。支持 IPIP/腾讯/ipapi.co 等常见格式
          if: "$get(welcome_popup_enabled).value === true"
        - $formkit: url
          name: welcome_popup_fallback_api
          id: welcome_popup_fallback_api
          label: IP 定位备选 API
          value: "https://r.inews.qq.com/api/ip2city?otype=json"
          help: 主接口失败时尝试的备选接口，默认腾讯 ip2city；留空则不使用备选
          if: "$get(welcome_popup_enabled).value === true"
        - $formkit: switch
          name: welcome_popup_show_once
          id: welcome_popup_show_once
          label: 同会话仅显示一次
          value: true
          help: 开启后同一浏览器会话内不再重复弹出；关闭则每次访问首页都显示
          if: "$get(welcome_popup_enabled).value === true"
    - group: style
      label: 总体样式
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 配色方案
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
          value: system
        - $formkit: select
          name: color_palette
          label: 主题配色
          options:
            - label: 暖屿 · 赤陶（默认）
              value: warm-island
            - label: 抹茶
              value: matcha
            - label: 黛蓝
              value: indigo
            - label: 樱粉
              value: sakura
            - label: 暮紫
              value: violet
            - label: 海盐
              value: sea
            - label: 琥珀
              value: amber
            - label: 梅酒
              value: plum
            - label: 石墨
              value: graphite
            - label: 可拿铁
              value: cocoa
            - label: 天青
              value: azure
          value: warm-island
          help: 整套官方预调配色（含深浅两套色板）；下方的强调色留空时跟随所选配色，填写后将覆盖配色中的强调色
        - $formkit: color
          name: accent_color
          label: 强调色
          help: 自定义强调色；留空使用「主题配色」自带的强调色
        - $formkit: select
          name: border_radius
          label: 圆角风格
          options:
            - label: Small
              value: small
            - label: Medium
              value: medium
            - label: Large
              value: large
          value: medium
        - $formkit: code
          name: custom_css
          label: 自定义 CSS
          language: css
        - $formkit: select
          name: layout_container_width
          label: 容器宽度
          options:
            - label: Narrow
              value: narrow
            - label: Medium
              value: medium
            - label: Wide
              value: wide
          value: medium
        - $formkit: switch
          name: animation_enabled
          label: 启用动效
          value: true
        - $formkit: switch
          name: animation_breath
          label: 呼吸动画
          value: true
        - $formkit: switch
          name: animation_scroll_reveal
          label: 滚动渐入
          value: true
        - $formkit: switch
          name: click_effect_enabled
          id: click_effect_enabled
          label: 鼠标点击效果
          value: false
          help: 在页面上点击鼠标时触发的视觉特效
        - $formkit: select
          name: click_effect_type
          id: click_effect_type
          label: 点击效果类型
          value: values
          if: "$get(click_effect_enabled).value === true"
          options:
            - label: 关闭
              value: off
            - label: 社会主义核心价值观
              value: values
            - label: 随机彩色爱心
              value: hearts
            - label: 烟花
              value: fireworks
            - label: 烟花波纹
              value: ripples
            - label: 粒子
              value: particles
            - label: 星星
              value: stars
            - label: 星星拖尾
              value: star-trail
            - label: 粒子拖尾
              value: particle-trail
    - group: navbar
      label: 导航栏
      formSchema:
        - $formkit: select
          name: navbar_style
          label: 导航栏样式
          options:
            - label: Glass
              value: glass
            - label: Minimal
              value: minimal
            - label: Float
              value: float
          value: glass
        - $formkit: select
          name: navbar_brand_type
          id: navbar_brand_type
          label: 左侧显示
          options:
            - label: 站点名称
              value: title
            - label: Logo
              value: logo
          value: title
        - $formkit: attachment
          name: navbar_logo
          id: navbar_logo
          label: 导航栏 Logo
          help: 选择"Logo"模式后在此上传图片；留空则使用基础设置中的自定义 Logo
          if: "$get(navbar_brand_type).value === 'logo'"
        - $formkit: select
          name: navbar_logo_radius
          id: navbar_logo_radius
          label: Logo 圆角
          options:
            - label: 直角
              value: square
            - label: 圆角
              value: rounded
            - label: 圆形
              value: circle
          value: rounded
          if: "$get(navbar_brand_type).value === 'logo'"
        - $formkit: switch
          name: navbar_show_search
          label: 显示搜索按钮
          value: true
        - $formkit: switch
          name: navbar_show_theme_switch
          label: 显示主题切换
          value: true
    - group: hero
      label: Hero 首屏
      formSchema:
        - $formkit: switch
          name: hero_enabled
          label: 启用 Hero 模块
          value: true
        - $formkit: text
          name: hero_title
          label: 主标题（留空则使用站点标题）
        - $formkit: text
          name: hero_subtitle
          label: 副标题（留空则使用站点副标题）
        - $formkit: select
          name: hero_description_mode
          id: hero_description_mode
          label: 描述文案来源
          options:
            - label: 无
              value: none
            - label: 一言
              value: hitokoto
            - label: 自定义
              value: custom
          value: hitokoto
        - $formkit: url
          name: hero_hitokoto_api
          label: 一言 API 地址
          value: https://v1.hitokoto.cn/
        - $formkit: checkbox
          name: hero_hitokoto_categories
          label: 一言句子类型
          options:
            - label: 动画
              value: a
            - label: 漫画
              value: b
            - label: 游戏
              value: c
            - label: 文学
              value: d
            - label: 原创
              value: e
            - label: 来自网络
              value: f
            - label: 其他
              value: g
            - label: 影视
              value: h
            - label: 诗词
              value: i
            - label: 哲学
              value: k
            - label: 抖机灵
              value: l
          value:
            - d
            - i
            - k
        - $formkit: textarea
          name: hero_custom_description
          label: 自定义描述文案
          key: hero_custom_description
          if: "$get(hero_description_mode).value === 'custom'"
        - $formkit: switch
          name: hero_hitokoto_auto_refresh
          id: hero_hitokoto_auto_refresh
          label: 一言自动刷新
          value: false
          help: 开启后按设定间隔自动刷新一言内容
        - $formkit: select
          name: hero_hitokoto_refresh_interval
          label: 一言刷新间隔
          if: "$get(hero_hitokoto_auto_refresh).value === true"
          options:
            - label: 5 秒
              value: 5000
            - label: 10 秒
              value: 10000
            - label: 15 秒
              value: 15000
            - label: 20 秒
              value: 20000
            - label: 25 秒
              value: 25000
            - label: 30 秒
              value: 30000
          value: 10000
        - $formkit: attachment
          name: hero_background_image
          label: 背景图片
        - $formkit: attachment
          name: hero_background_image_dark
          label: 深色模式背景图片
          help: 深色模式下显示的背景图；留空则深色模式也使用上方背景图
        - $formkit: color
          name: hero_title_color_light
          label: 浅色模式大标题颜色
          help: Hero 大标题文字颜色（浅色模式）；留空使用主题默认
        - $formkit: color
          name: hero_title_color_dark
          label: 深色模式大标题颜色
          help: Hero 大标题文字颜色（深色模式）；留空使用主题默认
        - $formkit: color
          name: hero_subtitle_color_light
          label: 浅色模式副标题颜色
          help: Hero 副标题文字颜色（浅色模式）；留空使用主题默认
        - $formkit: color
          name: hero_subtitle_color_dark
          label: 深色模式副标题颜色
          help: Hero 副标题文字颜色（深色模式）；留空使用主题默认
        - $formkit: color
          name: hero_quote_color_light
          label: 浅色模式一言颜色
          help: 一言（描述文案来源为"一言"时）的文字颜色（浅色模式）；留空使用主题默认
        - $formkit: color
          name: hero_quote_color_dark
          label: 深色模式一言颜色
          help: 一言的文字颜色（深色模式）；留空使用主题默认
        - $formkit: select
          name: hero_text_effect
          label: 文字显示效果
          options:
            - label: 无效果（默认）
              value: none
            - label: 阴影
              value: shadow
            - label: 光晕
              value: glow
            - label: 半透明遮罩层
              value: scrim
            - label: 渐变遮罩
              value: gradient
            - label: 容器（半透明边框圆角矩形）
              value: frame
          value: none
          help: 为 Hero 文字（标题/副标题/一言）叠加的辅助可读效果；默认无效果。遮罩类与容器类会在文字背后垫一层衬底并增加留白
    - group: home
      label: 首页
      formSchema:
        - $formkit: text
          name: home_pinned_title
          label: 置顶模块标题
        - $formkit: text
          name: home_posts_title
          label: 文章模块标题
        - $formkit: switch
          name: home_card_show_visit
          label: 文章卡片显示阅读量
          value: true
        - $formkit: switch
          name: home_card_show_wordcount
          label: 文章卡片显示字数
          value: true
        - $formkit: switch
          name: home_card_show_category
          label: 文章卡片显示分类
          value: true
        - $formkit: switch
          name: home_card_show_tags
          label: 文章卡片显示标签
          value: true
        - $formkit: number
          name: home_excerpt_lines
          label: 文章简介显示行数
          value: 3
        - $formkit: select
          name: home_post_loading
          label: 文章加载方式
          options:
            - label: 分页
              value: pagination
            - label: 下滑加载
              value: infinite_scroll
          value: pagination
        - $formkit: text
          name: home_label_newer
          label: 分页-较新标签
        - $formkit: text
          name: home_label_older
          label: 分页-较旧标签
        - $formkit: text
          name: home_label_loading
          label: 无限滚动-加载中文案
        - $formkit: text
          name: home_label_all_loaded
          label: 无限滚动-全部加载文案
        - $formkit: text
          name: home_label_no_posts
          label: 暂无文章文案
        - $formkit: text
          name: home_label_post_count
          label: 文章数量文案（{total}为占位符）
    - group: article
      label: 文章
      formSchema:
        - $formkit: switch
          name: article_show_cover
          label: 显示封面图
          value: true
        - $formkit: switch
          name: article_show_date
          label: 显示发布日期
          value: true
        - $formkit: switch
          name: article_show_category
          label: 显示分类
          value: true
        - $formkit: switch
          name: article_show_tags
          label: 显示标签
          value: true
        - $formkit: switch
          name: article_show_nav
          label: 显示上下篇导航
          value: true
        - $formkit: switch
          name: article_show_toc
          label: 显示文章目录
          value: true
        - $formkit: select
          name: article_toc_position
          label: 目录位置
          options:
            - label: 左侧
              value: left
            - label: 右侧
              value: right
          value: left
        - $formkit: switch
          name: article_show_word_count
          label: 显示字数统计
          value: true
        - $formkit: switch
          name: article_show_visit_count
          label: 显示阅读量统计
          value: true
        - $formkit: switch
          name: article_show_read_time
          label: 显示预计阅读时间
          value: false
        - $formkit: select
          name: article_code_theme
          label: 代码高亮主题
          options:
            - label: Warm
              value: warm
            - label: Cold
              value: cold
          value: warm
        - $formkit: switch
          name: article_extra_spacing
          label: 中英文混排自动加空格
          value: true
          help: 依赖「API 扩展包」插件，在服务端为正文自动添加中英文间距；插件未安装时自动跳过
        - $formkit: switch
          name: article_extra_highlight
          label: 使用服务端代码高亮
          value: false
          help: 依赖「API 扩展包」全量版（含 JS 运行时），启用后由服务端渲染代码高亮并替代主题自带样式；如环境不支持请勿开启
        - $formkit: select
          name: article_toc_expand
          label: 目录展开模式
          options:
            - label: 仅展开当前分组
              value: active
            - label: 全部展开
              value: all
          value: active
          help: 控制文章目录的展开方式
        - $formkit: switch
          name: article_show_related
          id: article_show_related
          label: 显示相关文章推荐
          value: false
        - $formkit: text
          name: article_related_title
          key: article_related_title
          label: 相关文章标题
          if: "$get(article_show_related).value === true"
        - $formkit: switch
          name: article_show_share
          id: article_show_share
          label: 显示分享按钮
          value: true
        - $formkit: text
          name: article_share_title
          key: article_share_title
          label: 分享区域标题
          if: "$get(article_show_share).value !== false"
        - $formkit: checkbox
          name: article_share_channels
          key: article_share_channels
          label: 分享渠道
          if: "$get(article_show_share).value !== false"
          options:
            - label: QQ
              value: qq
            - label: 微信
              value: wechat
            - label: 微博
              value: weibo
            - label: X (Twitter)
              value: twitter
            - label: Facebook
              value: facebook
            - label: Telegram
              value: telegram
          value:
            - qq
            - wechat
            - weibo
    - group: moments
      label: 瞬间
      formSchema:
        - $formkit: text
          name: moments_page_title
          label: 页面标题
        - $formkit: select
          name: moments_style
          label: 展示样式
          options:
            - label: Cards
              value: cards
            - label: Masonry
              value: masonry
          value: cards
        - $formkit: attachment
          name: moments_cover
          label: 顶部封面图
          help: 朋友圈样式顶部的封面图片，建议尺寸 1500×500
        - $formkit: select
          name: moments_loading_mode
          label: 加载方式
          options:
            - label: 下滑加载
              value: infinite_scroll
            - label: 分页
              value: pagination
          value: infinite_scroll
        - $formkit: number
          name: moments_page_size
          label: 每页显示数量
          value: 10
    - group: photos
      label: 图库
      formSchema:
        - $formkit: text
          name: photos_page_title
          label: 页面标题
        - $formkit: select
          name: photos_style
          label: 展示样式
          options:
            - label: Masonry
              value: masonry
            - label: Grid
              value: grid
            - label: Carousel
              value: carousel
          value: masonry
        - $formkit: number
          name: photos_columns
          label: 列数
          value: 3
        - $formkit: switch
          name: photos_show_ungrouped
          label: 显示未分组图片
          value: false
          help: 开启后"全部"视图中会显示未分组的图片，未分组图片区域的标题为"全部"。
        - $formkit: switch
          name: photos_show_group_title
          label: 显示分组标题
          value: true
          help: 关闭后"全部"视图中不再显示各分组的标题，所有图片合并展示。
    - group: links
      label: 友情链接
      formSchema:
        - $formkit: switch
          name: links_apply_form_enabled
          label: 显示友链申请表单
          value: true
          help: 在友链页底部展示访客申请表单；需链接管理插件开启「友链申请」功能，未开启时表单自动隐藏
        - $formkit: text
          name: links_page_title
          label: 页面标题
        - $formkit: select
          name: links_style
          label: 展示样式
          options:
            - label: Grid
              value: grid
            - label: List
              value: list
            - label: Cards
              value: cards
          value: cards
        - $formkit: switch
          name: links_show_comment
          label: 显示评论
          value: false
          help: 默认关闭评论功能，开启后在友情链接页面底部显示评论区
        - $formkit: switch
          name: links_random_order
          label: 随机排列
          value: false
          help: 开启后友情链接卡片随机排列顺序
        - $formkit: switch
          name: links_random_portal
          label: 随机传送门按钮
          value: true
          help: 开启后页面右上角显示"随机传送"按钮，点击随机访问一位博友
    - group: subscriptions
      label: 订阅
      formSchema:
        - $formkit: text
          name: subscriptions_page_title
          label: 页面标题
          placeholder: "订阅"
        - $formkit: text
          name: subscriptions_subtitle
          label: 页面副标题
          placeholder: "博友们的最新文章"
        - $formkit: number
          name: subscriptions_page_size
          label: 每页显示数量
          value: 20
          min: 1
          max: 100
          help: 单页展示的订阅动态条数，范围 1-100
        - $formkit: select
          name: subscriptions_loading_mode
          label: 加载方式
          options:
            - label: 分页
              value: pagination
            - label: 下滑加载
              value: infinite_scroll
          value: pagination
        - $formkit: select
          name: subscriptions_layout
          label: 布局样式
          options:
            - label: 列表卡片
              value: list
            - label: 网格卡片
              value: grid
          value: list
          help: 网格卡片布局一行显示3个，内容区域更宽
    - group: friends
      label: 朋友圈
      formSchema:
        - $formkit: text
          name: friends_page_title
          label: 页面标题
    - group: weread
      label: 微信读书
      formSchema:
        - $formkit: text
          name: weread_page_title
          label: 页面标题
          placeholder: "书架"
          help: 页面顶部标题与浏览器标签页标题；插件自带的标题区会自动隐藏以避免重复
        - $formkit: text
          name: weread_page_subtitle
          label: 页面副标题
          placeholder: "来自微信读书的同步藏书"
    - group: important_dates
      label: 记得
      formSchema:
        - $formkit: text
          name: idates_page_title
          label: 页面标题
          placeholder: "记得"
          help: 对应「记得」插件的前台页面 /important-dates；留空时使用插件自带的标题
        - $formkit: text
          name: idates_page_subtitle
          label: 页面副标题
          placeholder: "记着重要的日子、惦记的人，还有陪你跑的爱车"
    - group: messageboard
      label: 留言板
      formSchema:
        - $formkit: text
          name: messageboard_title
          label: 留言板标题
        - $formkit: textarea
          name: messageboard_subtitle
          label: 留言板副标题
    - group: comment
      label: 评论
      formSchema:
        - $formkit: select
          name: comment_style
          label: 评论样式
          options:
            - label: Warm
              value: warm
            - label: Minimal
              value: minimal
          value: warm
        - $formkit: switch
          name: comment_show_avatar
          label: 显示头像
          value: true
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: footer_copyright
          label: 版权信息（留空则使用默认格式 © 年份 站点标题）
        - $formkit: switch
          name: footer_show_stats
          id: footer_show_stats
          label: 显示全站统计
          value: true
          help: 在页脚展示文章数、分类数、评论数、访问量等站点统计数据
        - $formkit: checkbox
          name: footer_stats_items
          id: footer_stats_items
          label: 统计项
          if: "$get(footer_show_stats).value !== false"
          options:
            - label: 文章数
              value: post
            - label: 分类数
              value: category
            - label: 评论数
              value: comment
            - label: 访问量
              value: visit
            - label: 点赞数
              value: upvote
            - label: 总字数
              value: word
          value:
            - post
            - category
            - comment
            - visit
          help: 总字数依赖「API 扩展包」插件，未安装时自动隐藏该项
        - $formkit: switch
          name: footer_show_icp
          label: 显示 ICP 备案号
          value: false
          help: 开启后页脚显示 ICP 备案链接
        - $formkit: text
          name: footer_icp
          label: ICP 备案号
          help: 工信部ICP备案号，填写后页脚显示备案链接（指向 beian.miit.gov.cn）
          if: "$get(footer_show_icp).value === true"
        - $formkit: switch
          name: footer_show_mps
          label: 显示公网安备号
          value: false
          help: 开启后页脚显示公网安备图标和链接
        - $formkit: text
          name: footer_mps
          label: 公网安备号
          help: 公安部联网备案号，填写后页脚显示备案图标和链接（指向 beian.mps.gov.cn）
          if: "$get(footer_show_mps).value === true"
        - $formkit: text
          name: footer_mps_url
          label: 公网安备跳转链接
          help: 留空时默认指向 https://beian.mps.gov.cn/ ，可填写其他备案查询链接
          if: "$get(footer_show_mps).value === true"
        - $formkit: repeater
          name: footer_socials
          label: 社交链接
          children:
            - $formkit: text
              name: platform
              label: 平台名称
            - $formkit: text
              name: icon
              label: 图标类名（如 fa-brands fa-github）
            - $formkit: url
              name: url
              label: 链接地址
        - $formkit: switch
          name: footer_show_powered
          label: 显示 "Powered by Halo"
          value: true
        - $formkit: switch
          name: footer_show_theme
          label: 显示主题版本
          value: true
        - $formkit: code
          name: footer_custom_html
          label: 自定义 HTML（统计代码等）
          language: html
